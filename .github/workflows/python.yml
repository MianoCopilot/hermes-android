name: Python toolset

# The APK workflow only fires on changes under hermes-android-bridge/, so until
# now a change to the Python side ran no checks at all — including the tests
# that guard the relay allowlists, which is exactly where this project keeps
# breaking silently.
#
# This lands together with the fixes that make the suite deterministic. Before
# them the mic-stream negative-path tests failed on about one full run in three,
# and a workflow that is red a third of the time teaches everyone to ignore red.

on:
  push:
    branches: [main, master]
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'hermes-android-plugin/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements.txt'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'hermes-android-plugin/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject, and a current release. Anything that
        # only breaks on one of the two is worth knowing about.
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q
